<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Inclusion</title>

    <style>
        h2{
            color: red; 
            text-align: center;
            background-color: rgb(72, 129, 179);
            font-family: 'Courier New', Courier, monospace;
        }

        p{
            color: darkblue;
        }

    </style>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 style="color: blue; text-align: center;">CSS Inclusion</h1>

    <p style="font-size: 20px; font-weight: bold;">This paragraph is for inline CSS</p>

    <!-- Inline CSS is writing your CSS code in the same line as the HTML element you want to style. It is usually writen in the opening tag -->


    <!-- Internal CSS  -->
    <!-- It is written in the head section of our HTML document. It is usually written inside the <style> tag. -->
    
    <h2>Second Heading</h2>
    <p>This paragraph is meant for Internal CSS.</p>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Explicabo esse dolorum veritatis perferendis cum tenetur.</p>

    <h2>Another Heading</h2>

    <h1>Another Heading 1</h1>

    <h3>Heading 3</h3>

</body>
</html>
